<?xml version="1.0" encoding="UTF-8"?>
<!-- Página exibida quando o usuário está offline. Nenhum dado comercial inventado. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — MA STORE</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #FBF9F6;
        color: #24170D;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #EDE4D8;
        border-radius: 16px;
        padding: 40px 28px;
        box-shadow: 0 12px 32px rgba(24, 15, 7, 0.08);
      }
      .mark {
        width: 72px; height: 72px; border-radius: 20px;
        background: #180F07; margin: 0 auto 20px;
        display: grid; place-items: center;
        color: #D9BD96; font-weight: 700; letter-spacing: 2px; font-size: 20px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #6B5B4B; line-height: 1.55; font-size: 15px; }
      a {
        display: inline-block; padding: 12px 22px; border-radius: 999px;
        background: #180F07; color: #F6EFE4; text-decoration: none;
        font-weight: 600; font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">MA</div>
      <h1>Você está sem conexão</h1>
      <p>Verifique sua internet e tente novamente. As páginas que você já visitou continuam disponíveis.</p>
      <a href="/">Tentar novamente</a>
    </div>
  </body>
</html>
